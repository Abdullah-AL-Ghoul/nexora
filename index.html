<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXORA — Luxury Atelier & Artisanal Objects</title>
    <meta name="description" content="NEXORA is a curated luxury atelier of high-end artisanal objects — Swiss horology, acoustic engineering, full-grain leather, and architectural workspace essentials. Certified authenticity, insured white-glove shipping." />
    <meta name="theme-color" content="#0F1113" />
    <meta property="og:site_name" content="NEXORA" />
    <meta property="og:title" content="NEXORA — Luxury Atelier & Artisanal Objects" />
    <meta property="og:description" content="Curated masterworks: Swiss horology, acoustic engineering, full-grain leather, and architectural workspace essentials." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/og-cover.png" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="canonical" href="https://nexora.example.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the persisted theme before React hydrates to avoid a flash of the wrong theme.
      try {
        var stored = JSON.parse(localStorage.getItem('nexora_client_store') || '{}');
        if (stored && stored.state && stored.state.theme === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
